{% extends "base.html" %}

{% block content %}
<div class="profile-container">
    <div class="profile-card">
        <h1>Edit Profile</h1>

        <form method="post" enctype="multipart/form-data" class="profile-form">
            {% csrf_token %}

            <div class="form-group">
                <label for="{{ form.bio.id_for_label }}">Bio</label>
                {{ form.bio }}
                {{ form.bio.errors }}
            </div>

            <div class="form-group">
                <label for="id_avatar">Avatar</label>

                {% if form.instance.avatar %}
                    <div class="current-avatar-box">
                        <img src="{{ form.instance.avatar.url }}" alt="Current avatar">
                        <a href="{{ form.instance.avatar.url }}" target="_blank">
                            View current avatar
                        </a>
                    </div>
                {% endif %}

                <input type="file" name="avatar" id="id_avatar" accept="image/*">
                {{ form.avatar.errors }}
            </div>

            <div class="form-actions">
                <button type="submit" class="btn">Save changes</button>
                <a href="{% url 'user:profile' %}" class="btn secondary">Cancel</a>
                <a href="{% url 'user:account-settings' %}" class="btn secondary">Account settings</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
