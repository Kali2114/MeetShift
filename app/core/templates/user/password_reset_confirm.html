{% extends "base.html" %}

{% block content %}
<div class="profile-container">
    <div class="profile-card">
        <h1>Set New Password</h1>

        <form method="post" class="profile-form">
            {% csrf_token %}

            {{ form.as_p }}

            <div class="form-actions">
                <button type="submit" class="btn">
                    Save new password
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
