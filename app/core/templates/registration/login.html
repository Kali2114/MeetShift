{% extends "base.html" %}

{% block content %}
<h1>Login</h1>

<form method="post" class="page-form">
    {% csrf_token %}

    {{ form.as_p }}

    <div class="form-actions">
        <button type="submit" class="btn">Login</button>

        <a href="{% url 'user:password-reset' %}" class="btn secondary">
            Reset password
        </a>
    </div>
</form>
{% endblock %}
