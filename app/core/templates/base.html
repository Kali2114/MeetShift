{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MeetShift</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="logo-bar">
            <a class="logo" href="#">MeetShift</a>
        </div>

        <div class="navbar">
            <div class="nav-container">
                <nav class="nav-links">
                    <a href="{% url 'meeting:list' %}">Meetings</a>

                    {% if user.is_authenticated %}
                        <a href="{% url 'meeting:create-meeting' %}">Create</a>
                    {% endif %}
                </nav>

                <nav class="auth-links">
                    {% if user.is_authenticated %}
                        <a href="#">Logout</a>
                    {% else %}
                        <a href="#">Login</a>
                        <a href="#">Register</a>
                    {% endif %}
                </nav>
            </div>
        </div>
    </header>

    <main class="page-container">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="footer">
        <p>&copy; 2026 MeetShift. All rights reserved.</p>
    </footer>
</body>
</html>
