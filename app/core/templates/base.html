{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MeetShift</title>
    <link rel="stylesheet" href="{% static 'core/css/style.css' %}">
</head>
<body>
    <header>
        <nav>
            <a href="{% url 'meeting:list' %}">Meeting List</a>

            <div>
                {% if user.is_authenticated %}
                    <a href="{% url 'meeting:create-meeting' %}">Create meeting</a>
                    <a href="#">Logout</a>
                {% else %}
                    <a href="#">Login</a>
                    <a href="#">Register</a>
                {% endif %}
            </div>
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
