{% extends "base.html" %}

{% block content %}
    <h1>Delete meeting</h1>

    <p>Are you sure you want to delete "{{ object.title }}"?</p>

    <form method="post" class="page-form">
        {% csrf_token %}
        <button type="submit">Yes, delete</button>
    </form>

    <a href="{% url 'meeting:list' %}">Cancel</a>
{% endblock %}
