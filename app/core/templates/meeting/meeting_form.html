{% extends "base.html" %}

{% block content %}
<h1>
    {% if object %}
        Edit Meeting
    {% else %}
        Create Meeting
    {% endif %}
</h1>

<form method="post" class="page-form">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit">
        {% if object %}
            Save changes
        {% else %}
            Create
        {% endif %}
    </button>
</form>
{% endblock %}
