<h1>Create Meeting</h1>

<form method="post">
    {% csrf_token %}

    <p>
        <label for="id_title">Title:</label><br>
        {{ form.title }}
    </p>

    <p>
        <label for="id_description">Description:</label><br>
        {{ form.description }}
    </p>

    <button type="submit">Create</button>
</form>
