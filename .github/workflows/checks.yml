name: Checks

on:
  push:
  pull_request:

jobs:
  test-lint:
    runs-on: ubuntu-latest

    env:
      DB_HOST: db
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASS: ${{ secrets.DB_PASS }}
      DB_NAME: ${{ secrets.DB_NAME }}
      POSTGRES_DB: ${{ secrets.DB_NAME }}
      POSTGRES_USER: ${{ secrets.DB_USER }}
      POSTGRES_PASSWORD: ${{ secrets.DB_PASS }}
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      EMAIL_PORT: 587

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build containers
        run: docker compose build

      - name: Start database
        run: docker compose up -d db

      - name: Check formatting with Black
        run: docker compose run --rm app sh -c "black --check ."

      - name: Run Ruff
        run: docker compose run --rm app sh -c "ruff check . --no-cache"

      - name: Django system check
        run: docker compose run --rm app sh -c "python manage.py wait_for_db && python manage.py check"

      - name: Check for missing migrations
        run: docker compose run --rm app sh -c 'python manage.py wait_for_db && python manage.py makemigrations --check --dry-run'

      - name: Run tests with coverage
        run: docker compose run --rm --user root app sh -c "python manage.py wait_for_db && COVERAGE_FILE=/coverage/.coverage coverage run manage.py test && COVERAGE_FILE=/coverage/.coverage coverage report && COVERAGE_FILE=/coverage/.coverage coverage html -d /coverage/htmlcov"

  build-image:
    runs-on: ubuntu-latest
    needs: test-lint

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USER }}/meetshift:latest
            ${{ secrets.DOCKERHUB_USER }}/meetshift:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
