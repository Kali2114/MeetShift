name: Checks

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  test-lint:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        postgres-version: ["16.2-alpine3.19", "17-alpine"]

    env:
      # Fixed, non-sensitive values for the ephemeral CI-only Postgres
      # container (not real credentials, nothing to protect). Actions
      # secrets aren't exposed to Dependabot-triggered runs, so pulling
      # these from secrets.* broke CI on every dependency-bump PR.
      DB_HOST: db
      DB_USER: ci_test_user
      DB_PASS: ci-test-db-password-not-for-production
      DB_NAME: ci_test_db
      POSTGRES_DB: ci_test_db
      POSTGRES_USER: ci_test_user
      POSTGRES_PASSWORD: ci-test-db-password-not-for-production
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      EMAIL_PORT: 587
      POSTGRES_IMAGE: postgres:${{ matrix.postgres-version }}
      SECRET_KEY: ci-test-secret-key-not-for-production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build containers
        run: docker compose build

      - name: Start database
        run: docker compose up -d db

      - name: Check formatting with Black
        run: docker compose run --rm app sh -c "black --check ."

      - name: Run Ruff
        run: docker compose run --rm app sh -c "ruff check . --no-cache"

      - name: Django system check
        run: >
          docker compose run --rm app sh -c
          "python manage.py wait_for_db &&
          python manage.py check"

      - name: Check for missing migrations
        run: >
          docker compose run --rm app sh -c
          "python manage.py wait_for_db &&
          python manage.py makemigrations --check --dry-run"

      - name: Run tests with coverage
        run: >
          docker compose run --rm --user root app sh -c
          "python manage.py wait_for_db &&
          COVERAGE_FILE=/coverage/.coverage coverage run manage.py test &&
          COVERAGE_FILE=/coverage/.coverage coverage report &&
          COVERAGE_FILE=/coverage/.coverage coverage html -d /coverage/htmlcov &&
          COVERAGE_FILE=/coverage/.coverage coverage xml -o /coverage/coverage.xml"

      - name: Copy coverage report from Docker volume
        run: |
          docker create \
            --name coverage-copy \
            -v meetshift_coverage-data:/coverage \
            alpine

          docker cp coverage-copy:/coverage/htmlcov ./htmlcov
          docker cp coverage-copy:/coverage/coverage.xml ./coverage.xml
          docker rm coverage-copy

      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-report-postgres-${{ matrix.postgres-version }}
          path: htmlcov/

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

  build-image:
    runs-on: ubuntu-latest
    needs: test-lint

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USER }}/meetshift:latest
            ${{ secrets.DOCKERHUB_USER }}/meetshift:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-image

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    concurrency:
      group: meetshift-production-deploy
      cancel-in-progress: false

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy through AWS Systems Manager
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy MeetShift commit ${{ github.sha }}" \
            --parameters 'commands=[
              "set -e",
              "cd /home/ubuntu/MeetShift",
              "git config --system --add safe.directory /home/ubuntu/MeetShift",
              "git fetch origin",
              "git reset --hard origin/main",
              "docker compose -f docker-compose.prod.yml pull app celery",
              "docker compose -f docker-compose.prod.yml up -d app celery",
              "docker compose -f docker-compose.prod.yml restart nginx",
              "docker compose -f docker-compose.prod.yml ps",
              "docker image prune -f"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{
              Status: Status,
              Output: StandardOutputContent,
              Error: StandardErrorContent
            }'

      - name: Production health check
        run: |
          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 10 \
            --retry-delay 5 \
            --retry-all-errors \
            --max-time 20 \
            https://meetshift.org/health/ > /dev/null

          echo "MeetShift deployment completed successfully."
